services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://kakeibo:${DB_PASSWORD:-kakeibo}@db:5432/kakeibo
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: kakeibo
      POSTGRES_USER: kakeibo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kakeibo}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kakeibo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
